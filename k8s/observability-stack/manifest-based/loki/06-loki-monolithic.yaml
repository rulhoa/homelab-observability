---
# ConfigMap for Loki configuration (monolithic mode)
# Single binary runs all components
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability-stack
data:
  config.yaml: |
    # Loki server configuration
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: info
    
    # Auth configuration - single tenant mode
    auth_enabled: false
    
    ingester_client:
      grpc_client_config:
        grpc_compression: gzip

    ingester:
      lifecycler:
        ring:
          kvstore:
            store: memberlist
          replication_factor: 1
      chunk_idle_period: 30m
      chunk_block_size: 262144
      chunk_encoding: snappy
      chunk_retain_period: 1m
      wal:
        enabled: true
        dir: /loki/wal

    # Common configuration
    common:
      path_prefix: /loki
      replication_factor: 1
      
      # Ring configuration
      ring:
        kvstore:
          store: inmemory
        instance_addr: 127.0.0.1
    
    # Schema configuration
    schema_config:
      configs:
        - from: 2025-01-01
          store: tsdb  # Time series database for index
          object_store: filesystem  # Store chunks on filesystem
          schema: v13  # Latest schema version
          index:
            prefix: index_
            period: 24h  # Create new index every 24 hours
    
    # Storage configuration
    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/index_cache
      
      filesystem:
        directory: /loki/chunks
    
    # Limits configuration
    limits_config:
      # Retention period to apply to stored data, only applies if retention_enabled is
      # true in the compactor config. As of version 2.8.0, a zero value of 0 or 0s
      # disables retention. In previous releases, Loki did not properly honor a zero
      # value to disable retention and a really large value should be used instead.
      # Minimum is 24h
      retention_period: 24h
      retention_stream:
        - selector: '{namespace="dev"}'
          priority: 1
          period: 24h
      
      # Ingestion rate limits per tenant
      ingestion_rate_mb: 10  # 10MB/s
      ingestion_burst_size_mb: 20  # 20MB burst

      # Max line size
      max_line_size: 256KB
      
      # Query limits
      max_query_length: 0h
      max_query_lookback: 720h # 30 days
      split_queries_by_interval: 15m
      
      # Stream limits
      max_streams_per_user: 10000
      max_global_streams_per_user: 50000
      per_stream_rate_limit: 5MB
      per_stream_rate_limit_burst: 10MB

      reject_old_samples: true
      reject_old_samples_max_age: 30m
    
    # Compactor for retention enforcement
    compactor:
      working_directory: /loki/compactor
      delete_request_store: filesystem
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
    
    # Query range configuration
    query_range:
      align_queries_with_step: true
      cache_results: true
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    # Query scheduler configuration
    query_scheduler:
      max_outstanding_requests_per_tenant: 1024

    querier:
      # Each `querier` component process runs a number of parallel workers to process queries simultaneously.
      # You may want to adjust this up or down depending on your resource usage
      # (more available cpu and memory can tolerate higher values and vice versa),
      # but we find the most success running at around `16` with tsdb
      max_concurrent: 4

    # Ruler configuration (for alerting rules - Phase 3.5)
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/prom-rules
      alertmanager_url: http://alertmanager:9093
      ring:
        kvstore:
          store: memberlist
      enable_api: true
      enable_alertmanager_v2: true
      wal:
        dir: /loki/ruler-wal
      evaluation:
        mode: remote
        query_frontend:
          address: dns:///loki:9095
      remote_write:
        enabled: true
        clients:
          local:
            url: http://vminsert:8480/api/v1/write
            queue_config:
              # send immediately as soon as a sample is generated
              capacity: 1
              batch_send_deadline: 0s

---
# StatefulSet for Loki (monolithic mode)
# Single pod runs all Loki components
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: observability-stack
  labels:
    app: loki
    mode: monolithic
spec:
  replicas: 1
  
  serviceName: loki
  
  # RollingUpdate strategy
  updateStrategy:
    type: RollingUpdate
  
  podManagementPolicy: OrderedReady
  
  selector:
    matchLabels:
      app: loki
      mode: monolithic
  
  template:
    metadata:
      labels:
        app: loki
        mode: monolithic
    spec:
      # Security context
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
      
      containers:
      - name: loki
        image: grafana/loki:3.6.2
        
        args:
          # Monolithic mode: run all components in single process
          - -config.file=/etc/loki/config.yaml
          - -target=all
        
        ports:
        - containerPort: 3100
          name: http
          protocol: TCP
        - containerPort: 9095
          name: grpc
          protocol: TCP
        
        # Resource allocation
        resources:
          requests:
            cpu: 500m       # 0.5 CPU cores
            memory: 1Gi     # 1GB RAM
          limits:
            cpu: 2000m      # 2 CPU cores
            memory: 2Gi     # 2GB RAM
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        volumeMounts:
        # Config file
        - name: config
          mountPath: /etc/loki
        
        # Persistent storage
        - name: storage
          mountPath: /loki
      
      volumes:
      # Loki configuration
      - name: config
        configMap:
          name: loki-config
  
  # PVC template
  volumeClaimTemplates:
  - metadata:
      name: storage
    spec:
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          # 10GB: Size-based retention
          storage: 10Gi

---
# Headless service for Loki
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability-stack
  labels:
    app: loki
spec:
  clusterIP: None
  
  selector:
    app: loki
    mode: monolithic
  
  ports:
  - port: 3100
    name: http
    protocol: TCP
  - port: 9095
    name: grpc
    protocol: TCP

---
# LoadBalancer service for external access
apiVersion: v1
kind: Service
metadata:
  name: loki-lb
  namespace: observability-stack
  labels:
    app: loki
spec:
  type: LoadBalancer
  
  selector:
    app: loki
    mode: monolithic
  
  ports:
  - port: 3100
    targetPort: 3100
    protocol: TCP
    name: http
tempo:
  # -- labels for tempo
  #labels: {}
  labels:
    app: tempo
    component: tempo

  tempo:
    tag: "2.9.0-amd64"

    #resources: {}
    resources:
      requests:
        cpu: 100m
        memory: 0.5Gi
      limits:
        cpu: 2000m
        memory: 2Gi

    #memBallastSizeMbs: 1024
    memBallastSizeMbs: 256

    # -- If true, Tempo will report anonymous usage data about the shape of a deployment to Grafana Labs
    reportingEnabled: false

    metricsGenerator:
      # -- If true, enables Tempo's metrics generator (https://grafana.com/docs/tempo/next/metrics-generator/)
      enabled: true
      #remoteWriteUrl: "http://prometheus.monitoring:9090/api/v1/write"
      remoteWriteUrl: "http://vminsert:8480/insert/0/prometheus/api/v1/write"

    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
            - local-blocks
            - host-info

    # Refers to: https://grafana.com/docs/tempo/latest/configuration/#server
    server:
      # -- HTTP server listen port
      http_listen_port: 3200
      #grpc_listen_port: 9095

    # Refers to: https://grafana.com/docs/tempo/latest/configuration/#query-frontend
    queryFrontend: {}

    retention: 24h


  tempoQuery:
    repository: grafana/tempo-query
    tag: "2.9.0-amd64"

    # -- if False the tempo-query container is not deployed
    enabled: true

    ingress:
      enabled: false
      ingressClassName: traefik
      # Values can be templated
      #annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
      labels: {}
      path: /

      # pathType is only for k8s >= 1.1=
      pathType: Prefix

      hosts:
        - query.tempo.example.com
      ## Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
      extraPaths: []
      # - path: /*
      #   backend:
      #     serviceName: ssl-redirect
      #     servicePort: use-annotation
      ## Or for k8s > 1.19
      # - path: /*
      #   pathType: Prefix
      #   backend:
      #     service:
      #       name: ssl-redirect
      #       port:
      #         name: use-annotation


      tls: []
      #  - secretName: tempo-query-tls
      #    hosts:
      #      - query.tempo.example.com

    #resources: {}
    resources:
      requests:
        cpu: 500m
        memory: 0.5Gi
      limits:
        cpu: 2000m
        memory: 2Gi

    ## Additional container arguments
    extraArgs: {}
    # -- Environment variables to add
    extraEnv: []
    # -- Volume mounts to add
    extraVolumeMounts: []
    # - name: extra-volume
    #   mountPath: /mnt/volume
    #   readOnly: true
    #   existingClaim: volume-claim
    securityContext: {}
      # allowPrivilegeEscalation: false
      #  capabilities:
      #    drop:
      #    - ALL
      # readOnlyRootFilesystem: false # fails if true, do not enable


  service:
    #type: ClusterIP
    type: LoadBalancer
    #clusterIP: ""
    # -- (string) IP address, in case of 'type: LoadBalancer'
    #loadBalancerIP:
    # -- If service type is LoadBalancer, the exposed protocol can either be "UDP", "TCP" or "UDP,TCP"
    protocol: "TCP"

  serviceMonitor:
    enabled: false

  persistence:
    enabled: true
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  # -- Pod Annotations
  podAnnotations: {}

  # -- Volumes to add
  extraVolumes: []


  # -- The name of the PriorityClass
  priorityClassName: null
  # -- hostAliases to add
  hostAliases: []
  #  - ip: 1.2.3.4
  #    hostnames:
  #      - domain.tld



alloy:

  alloy:
    configMap:
      content: |-
        // Write your Alloy config here:
        

        //===Exporters===

        loki.write "default" {
          endpoint {
            url = "http://loki:3100/loki/api/v1/push"
          }
        }

        prometheus.remote_write "default" {
          endpoint {
            url = "http://vminsert:8480/insert/0/prometheus/api/v1/push"
          }
        }


        

        //====Otel listener====

        otelcol.receiver.otlp "example" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }

          http {
            endpoint = "0.0.0.0:4318"
          }

          output {
              logs    = [otelcol.processor.batch.default.input]
              metrics = [otelcol.processor.batch.default.input]
              traces  = [otelcol.processor.batch.default.input]
          }

        }

        // Logs pipeline - routes logs to Loki
        otelcol.exporter.loki "default" {
          forward_to = [loki.write.default.receiver]
        }

        otelcol.exporter.prometheus "default" {
          forward_to = [prometheus.remote_write.default.receiver]
        }

        otelcol.exporter.otlp "default" {
            client {
                endpoint = "o11y-tempo:4317"
                tls {
                    insecure = true
                    insecure_skip_verify = true
                }
            }
        }


        otelcol.processor.batch "default" {
          output {
            metrics = [otelcol.exporter.prometheus.default.input]
            logs    = [otelcol.exporter.loki.default.input]
            traces  = [otelcol.exporter.otlp.default.input]
          }
        }




        //===Self monitoring===

        prometheus.exporter.self "default" {
        }

        prometheus.scrape "default" {
          targets    = prometheus.exporter.self.default.targets
          forward_to = [prometheus.remote_write.default.receiver]
        }
        
        logging {
          //level = "info"
          level = "warn"
          format = "logfmt"
          write_to = [loki.write.default.receiver]
        }

        tracing {
          sampling_fraction = 0.1
          write_to          = [otelcol.exporter.otlp.default.input]
        }

        



        //====NODE LOG====

        // local.file_match discovers files on the local filesystem using glob patterns and the doublestar library. It returns an array of file paths.
        local.file_match "node_logs" {
          path_targets = [{
              // Monitor syslog to scrape node-logs
              __path__  = "/var/log/syslog",
              job       = "node/syslog",
              node_name = sys.env("HOSTNAME"),
              cluster   = "lab-cluster",
          }]
        }

        // loki.source.file reads log entries from files and forwards them to other loki.* components.
        // You can specify multiple loki.source.file components by giving them different labels.
        loki.source.file "node_logs" {
          targets    = local.file_match.node_logs.targets
          forward_to = [loki.write.default.receiver]
        }

        //====POD LOGS====

        // discovery.kubernetes allows you to find scrape targets from Kubernetes resources.
        // It watches cluster state and ensures targets are continually synced with what is currently running in your cluster.
        discovery.kubernetes "pod" {
          role = "pod"
          // Restrict to pods on the node to reduce cpu & memory usage
          selectors {
            role = "pod"
            field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
          }
        }

        // discovery.relabel rewrites the label set of the input targets by applying one or more relabeling rules.
        // If no rules are defined, then the input targets are exported as-is.
        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pod.targets

          // Label creation - "namespace" field from "__meta_kubernetes_namespace"
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            action = "replace"
            target_label = "namespace"
          }

          // Label creation - "pod" field from "__meta_kubernetes_pod_name"
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            action = "replace"
            target_label = "pod"
          }

          // Label creation - "container" field from "__meta_kubernetes_pod_container_name"
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            action = "replace"
            target_label = "container"
          }

          // Label creation -  "app" field from "__meta_kubernetes_pod_label_app_kubernetes_io_name"
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            action = "replace"
            target_label = "app"
          }

          // Label creation -  "job" field from "__meta_kubernetes_namespace" and "__meta_kubernetes_pod_container_name"
          // Concatenate values __meta_kubernetes_namespace/__meta_kubernetes_pod_container_name
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            action = "replace"
            target_label = "job"
            separator = "/"
            replacement = "$1"
          }

          // Label creation - "__path__" field from "__meta_kubernetes_pod_uid" and "__meta_kubernetes_pod_container_name"
          // Concatenate values __meta_kubernetes_pod_uid/__meta_kubernetes_pod_container_name.log
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            action = "replace"
            target_label = "__path__"
            separator = "/"
            replacement = "/var/log/pods/*$1/*.log"
          }

          // Label creation -  "container_runtime" field from "__meta_kubernetes_pod_container_id"
          rule {
            source_labels = ["__meta_kubernetes_pod_container_id"]
            action = "replace"
            target_label = "container_runtime"
            regex = "^(\\S+):\\/\\/.+$"
            replacement = "$1"
          }
        }

        // loki.source.kubernetes tails logs from Kubernetes containers using the Kubernetes API.
        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.process.pod_logs.receiver]
        }

        // loki.process receives log entries from other Loki components, applies one or more processing stages,
        // and forwards the results to the list of receivers in the component's arguments.
        loki.process "pod_logs" {
          stage.static_labels {
              values = {
                cluster = "lab-cluster",
              }
          }

          forward_to = [loki.write.default.receiver]
        }

        //====KUBERNETES EVENTS====

        // loki.source.kubernetes_events tails events from the Kubernetes API and converts them
        // into log lines to forward to other Loki components.
        loki.source.kubernetes_events "cluster_events" {
          job_name   = "integrations/kubernetes/eventhandler"
          log_format = "logfmt"
          forward_to = [
            loki.process.cluster_events.receiver,
          ]
        }

        // loki.process receives log entries from other loki components, applies one or more processing stages,
        // and forwards the results to the list of receivers in the component's arguments.
        loki.process "cluster_events" {
          forward_to = [loki.write.default.receiver]

          stage.static_labels {
            values = {
              cluster = "lab-cluster",
            }
          }

          stage.labels {
            values = {
              kubernetes_cluster_events = "job",
            }
          }
        }


    # -- Extra ports to expose on the Alloy container.
    extraPorts:
      - name: "otel-grpc"
        port: 4317
        targetPort: 4317
        protocol: "TCP"
        appProtocol: "grpc"
      - name: "otel-http"
        port: 4318
        targetPort: 4318
        protocol: "TCP"
        appProtocol: "http"



  crds:
    # -- Whether to install CRDs for monitoring.
    create: true


    mounts:
      # -- Mount /var/log from the host into the container for log collection.
      varlog: true
      # -- Mount /var/lib/docker/containers from the host into the container for log
      # collection.
      dockercontainers: false



    # -- Resource requests and limits to apply to the Grafana Alloy container.
    #resources: {}
    resources:
      requests:
        cpu: 100m
        memory: 0.5Gi
      limits:
        cpu: 2000m
        memory: 2Gi


  image:
    # -- (string) Grafana Alloy image tag. When empty, the Chart's appVersion is
    # used.
    tag: "v1.12.1"


